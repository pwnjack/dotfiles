# Runs what the pre-commit hook runs, on the whole tree: shellcheck at warning
# level on every shell script, then every test suite. The repo expects to live
# at ~/.config, so the suites run from a copy there as an unprivileged user
# (root would pass permission checks a real user fails).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # --init reaps orphans, so a suite that waits for a child to exit does not
    # see it linger as a zombie of `tail`, the container's default PID 1.
    # /tmp is a tmpfs because on overlayfs /proc/locks names the underlying
    # file, not the one stat sees, and the update card's lock probe compares them.
    container:
      image: archlinux:latest
      options: --init --tmpfs /tmp:rw,exec,nosuid,size=4g --security-opt systempaths=unconfined
    timeout-minutes: 20
    steps:
      # git first, so the checkout is a real repository: test.sh discovers
      # suites from git. glibc-locales has the Italian locale the agenda
      # suite formats dates in. The rest is what the suites call: libnm is the NM
      # typelib the panel's network adapter imports, and the hypridle and
      # hyprsunset parser suites pass silently without their binaries, so
      # drop nothing on a green run.
      - name: Install test dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git diffutils which jq shellcheck inotify-tools glibc-locales
          nodejs python python-icalendar lua luajit gjs libnm
          hypridle hyprsunset
          qt6-declarative quickshell waybar matugen imagemagick khal vdirsyncer
          gcc make pkgconf gtk3 json-glib
          ttf-firacode-nerd noto-fonts

      # The copy below would otherwise carry the job token in .git/config.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The workspace belongs to the runner's user, not the container's root,
      # so git refuses it until it is marked safe. bash runs with pipefail,
      # so a git failure cannot pass as "no files".
      - name: Shellcheck
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z -- '*.sh' 'scripts/hooks/*' | xargs -0 shellcheck -S warning

      - name: Lock probe diagnostics (temporary)
        shell: bash
        run: |
          set -x
          command -v flock stat; findmnt /tmp || mount | grep ' /tmp '
          findmnt /proc/locks || echo "proc/locks not a separate mount"
          d=$(mktemp -d); exec 9>"$d/run.lock"; flock -n 9; echo "flock=$?"
          stat -L -c '%Hd %Ld %i %d %D' "$d/run.lock"; cat /proc/locks; echo "pid=$$"
          useradd -m dbg && runuser -l dbg -c 'd=$(mktemp -d); exec 9>"$d/l"; flock -n 9; stat -L -c "%Hd %Ld %i" "$d/l"; cat /proc/locks; echo pid=$$'

      - name: Test suites
        shell: bash
        run: |
          useradd -m ci
          cp -a "$GITHUB_WORKSPACE" /home/ci/.config
          chown -R ci:ci /home/ci/.config
          runuser -l ci -c 'cd ~/.config && ./test.sh'
