#
# Hypridle Configuration
# Manages screen locking and power management based on inactivity
#
# Reference: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
#

general {
    # hypridle's default (auto) waits for the lock before sleep only when lock_cmd
    # contains the string "hyprlock", which lock.sh's path does not; 3 waits until
    # the session is locked, so a suspend never resumes onto an unlocked desktop.
    inhibit_sleep = 3
    lock_cmd = ~/.config/scripts/hyprland/lock.sh   # The one lock path: locks at once, a detached stop saves a recording, never a second hyprlock
    before_sleep_cmd = loginctl lock-session    # Lock before system suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # Turn on display after wake
    ignore_dbus_inhibit = false                 # Respect inhibit requests (e.g., video playback)
}

# Lock screen after inactivity
listener {
    timeout = 1800
    on-timeout = loginctl lock-session          # Goes through lock_cmd, so it never starts a second hyprlock
    on-resume = echo "Unlocked"
}

# Turn off monitor after inactivity
listener {
    timeout = 3600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
