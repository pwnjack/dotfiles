# 
# Hyprlock Config 
# Created by: @GeodeArc
# 
# Refer to https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/ for customization

source = config/hardware/primary.conf
source = config/colors.conf

# SETTINGS
# `grace` is top-level, NOT a general{} key. hyprlock 0.9.6 registers
# general:hide_cursor and general:ignore_empty_input but no general:grace, so a
# grace inside the block is reported as "config option <general:grace> does not
# exist" and silently ignored on every lock. Confirmed by probing the binary,
# not by reading docs. Behaviour was unaffected only because hyprlock's default
# grace is 0, which is what the ignored line asked for.
grace = 0

general {
    hide_cursor = true
    ignore_empty_input = true
}

# AUTHENTICATION
auth {
    fingerprint {
    	enabled = true
    	ready_message = (Or Scan Fingerprint)
    	present_message = (Scanning...)
    }	
}

# BACKGROUNDS
background {
    monitor =
    path = ~/.config/options/wallpaper
    color = $background
    # Higher blur quality for security screen (more passes = better privacy)
    blur_passes = 6
    blur_size = 4
	brightness = 0.8
}

# INPUT FIELD
input-field {
    monitor = $monitor
    size = 300, 50
    outline_thickness = 1
    rounding = 100
    dots_size = 0.22
    dots_spacing = 0.30
    dots_center = true

    inner_color = $background
    outer_color = $background
    check_color= rgb(ffc800) rgb(ff4d00) 180deg
    fail_color= rgb(ff0000)
    capslock_color=rgba(ffff644d)
    numlock_color=rgba(ffff644d)
    bothlock_color=rgb(ff4d00)
    font_color = $foregroundfull
    
    placeholder_text = Enter Password $FPRINTPROMPT
    fail_text = Incorrect, <b>attempt: $ATTEMPTS</b>

    fade_on_empty = false
    hide_input = false
    invert_numlock = true
    swap_font_color = false 
    position = 0, 200
    halign = center
    valign = bottom
}

# GREETER
label {
    monitor = $monitor
    text =    Welcome back, $USER
    color = $foregroundfull
    shadow_size = 10
    shadow_color = rgba(000000e6)
    shadow_boost = 1.2
    font_size = 16
    font_family = Adwaita Sans
    position = 0, -50
    halign = center
    valign = top
}

# TIME
label {
    monitor = $monitor
    text = cmd[update:1000] echo -e "$(date +"%$([ "$(cat ~/.config/options/clock 2>/dev/null)" = 12h ] && echo I || echo H)")"
    color = $foreground
    shadow_size = 10
    shadow_color = rgba(000000e6)
    shadow_boost = 1.2
    font_size = 120
    font_family = Adwaita Sans, Heavy
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor = $monitor
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgb(ffffff)
    shadow_size = 10
    shadow_color = rgba(000000e6)
    shadow_boost = 1.2
    font_size = 120
    font_family = Adwaita Sans, Heavy
    position = 0, 80
    halign = center
    valign = center
}

# DATE
label {
    monitor = $monitor
    text = cmd[update:60000] echo "$(date +"%A, %d %b")"
    color = rgb(ffffff)
    shadow_size = 10
    shadow_color = rgba(000000e6)
    shadow_boost = 1.2
    font_size = 16
    font_family = Adwaita Sans
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor = $monitor
    text = cmd[update:5000] bash ~/.config/scripts/hyprland/mediaexec.sh --plain
    color = $foregroundfull
    shadow_size = 10
    shadow_color = rgba(000000e6)
    shadow_boost = 1.2
    font_size = 16
    font_family = Adwaita Sans
    position = 0, 80
    halign = center
    valign = bottom
}
