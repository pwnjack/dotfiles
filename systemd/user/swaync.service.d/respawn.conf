# SwayNC is started by scripts/hyprland/respawn.sh (see autostart.lua), but the
# packaged D-Bus file org.erikreider.swaync.service names SystemdService=
# swaync.service, so a notification sent before that copy owns
# org.freedesktop.Notifications makes systemd start a second one. It exits at
# once ("already running"), is restarted and ends up failed. Skip the unit
# while this user (%U, the UID) has a swaync process: exit 1 from
# ExecCondition= means "skip", not "failed".
#
# Accepted remainder: if systemd's copy starts first it wins and respawn.sh
# bows out on its pgrep check. That is harmless for SwayNC, which launches no
# programs of its own, so systemd's cgroup kill on a crash (the reason
# respawn.sh exists) has nothing to kill.
[Service]
ExecCondition=/bin/sh -c '! pgrep -xu %U swaync'
